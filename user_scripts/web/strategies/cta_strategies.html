<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeighNa 交易平台 - CTA策略</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sidebar-link.active { background-color: #3b82f6; color: white; }
    </style>
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
</head>
<body class="bg-gray-100">
    <div class="flex h-screen bg-gray-200">
        <!-- Sidebar Placeholder -->
        <div id="sidebar-placeholder"></div>

        <!-- Main content -->
        <div class="flex-1 flex flex-col overflow-hidden ml-64">
            <!-- 头部 -->
            <header class="bg-white shadow p-4">
                <h1 class="text-xl font-semibold text-gray-800">CTA策略</h1>
            </header>

            <!-- 内容区域 -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
                <div class="container mx-auto space-y-6">

                    <!-- 策略管理工具栏 -->
                    <div class="bg-white p-6 rounded-lg shadow mb-6">
                        <div class="flex flex-col md:flex-row md:justify-between md:items-center space-y-4 md:space-y-0">
                            <div>
                                <h2 class="text-lg font-semibold text-gray-700">策略管理</h2>
                                <p class="text-sm text-gray-500">管理您的CTA策略</p>
                            </div>
                            <div class="flex space-x-4">
                                <button class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">
                                    添加策略
                                </button>
                                <button class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">
                                    全部初始化
                                </button>
                                <button class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded">
                                    全部停止
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 策略列表 -->
                    <div class="bg-white p-6 rounded-lg shadow">
                        <h2 class="text-lg font-semibold text-gray-700 mb-4 border-b pb-2">策略列表</h2>
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">名称</th>
                                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">类型</th>
                                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">交易合约</th>
                                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">持仓</th>
                                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">当日盈亏</th>
                                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">总盈亏</th>
                                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200">
                                    <!-- 策略1 -->
                                    <tr>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm font-medium text-gray-900">双均线-IF</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">DoubleMA</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">IF2109.CFFEX</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm">
                                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                                                运行中
                                            </span>
                                        </td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm text-red-600">-2</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm text-green-600">+8,400.00</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm text-green-600">+15,200.00</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm font-medium space-x-2">
                                            <a href="#" class="text-blue-600 hover:text-blue-900">编辑</a>
                                            <a href="#" class="text-red-600 hover:text-red-900">停止</a>
                                            <a href="#" class="text-indigo-600 hover:text-indigo-900">查看</a>
                                        </td>
                                    </tr>
                                    <!-- 策略2 -->
                                    <tr>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm font-medium text-gray-900">布林带-rb</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">BollingerBot</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">rb2110.SHFE</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm">
                                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                                                运行中
                                            </span>
                                        </td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm text-red-600">-10</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm text-green-600">+5,200.00</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm text-green-600">+12,500.00</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm font-medium space-x-2">
                                            <a href="#" class="text-blue-600 hover:text-blue-900">编辑</a>
                                            <a href="#" class="text-red-600 hover:text-red-900">停止</a>
                                            <a href="#" class="text-indigo-600 hover:text-indigo-900">查看</a>
                                        </td>
                                    </tr>
                                    <!-- 策略3 -->
                                    <tr>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm font-medium text-gray-900">海龟交易-au</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">TurtleTrader</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">au2112.SHFE</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm">
                                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">
                                                已停止
                                            </span>
                                        </td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">0</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">0.00</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm text-red-600">-3,500.00</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-sm font-medium space-x-2">
                                            <a href="#" class="text-blue-600 hover:text-blue-900">编辑</a>
                                            <a href="#" class="text-green-600 hover:text-green-900">启动</a>
                                            <a href="#" class="text-indigo-600 hover:text-indigo-900">查看</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- 策略参数设置 (模态框，默认隐藏) -->
                    <div id="strategyModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center hidden">
                        <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-2xl">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-lg font-semibold text-gray-900">策略参数设置</h3>
                                <button id="closeModal" class="text-gray-400 hover:text-gray-500">
                                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                </button>
                            </div>
                            <form class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">策略名称</label>
                                    <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" value="双均线-IF">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">策略类型</label>
                                    <select class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                                        <option>DoubleMA</option>
                                        <option>BollingerBot</option>
                                        <option>TurtleTrader</option>
                                        <option>AtrRsi</option>
                                        <option>KingKeltner</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">交易合约</label>
                                    <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" value="IF2109.CFFEX">
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">快速均线周期</label>
                                        <input type="number" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" value="10">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">慢速均线周期</label>
                                        <input type="number" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" value="30">
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">固定手数</label>
                                        <input type="number" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" value="1">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">K线周期</label>
                                        <select class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                                            <option>1分钟</option>
                                            <option>5分钟</option>
                                            <option selected>15分钟</option>
                                            <option>30分钟</option>
                                            <option>1小时</option>
                                            <option>日线</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="flex justify-end space-x-3 pt-4">
                                    <button type="button" class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                                        取消
                                    </button>
                                    <button type="button" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                                        保存
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>
    <script>
        // 简单的模态框控制
        document.addEventListener('DOMContentLoaded', function() {
            const editButtons = document.querySelectorAll('a.text-blue-600');
            const modal = document.getElementById('strategyModal');
            const closeModal = document.getElementById('closeModal');

            editButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    modal.classList.remove('hidden');
                });
            });

            closeModal.addEventListener('click', function() {
                modal.classList.add('hidden');
            });

            // 点击模态框外部关闭
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.classList.add('hidden');
                }
            });
        });
    </script>

    <!-- Load Sidebar Script -->
    <script src="../js/load_sidebar.js"></script>

</body>
</html>
