<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeighNa 交易平台 - 选股策略</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sidebar-link.active { background-color: #3b82f6; color: white; }
    </style>
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
</head>
<body class="bg-gray-100">
    <div class="flex h-screen bg-gray-200">
        <!-- Sidebar Placeholder -->
        <div id="sidebar-placeholder"></div>

        <!-- Main content -->
        <div class="flex-1 flex flex-col overflow-hidden ml-64">
            <!-- 头部 -->
            <header class="bg-white shadow p-4 flex justify-between items-center">
                <h1 class="text-xl font-semibold text-gray-800">选股策略</h1>
                 <a href="../strategies/create_stock_selection_strategy.html" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">
                    + 新建选股策略
                </a>
            </header>

            <!-- 内容区域 -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
                <div class="container mx-auto">
                    <div class="bg-white p-6 rounded-lg shadow">
                        <h2 class="text-lg font-semibold text-gray-700 mb-4">选股策略列表</h2>
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">策略名称</th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">运行频率</th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">运行状态</th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">下次运行时间</th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">上次运行时间</th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">上次结果</th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200">
                                    <!-- Example Row 1: Daily -->
                                    <tr>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">每日市值因子选股</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">每日 08:00</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">已启用</span></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">2024-07-27 08:00</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">2024-07-26 08:05</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">成功 (选出 50 支)</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2">
                                            <a href="#" class="text-indigo-600 hover:text-indigo-900">详情</a>
                                            <button onclick="alert('手动执行: 每日市值因子选股')" class="text-blue-600 hover:text-blue-900">手动执行</button>
                                            <a href="#" class="text-yellow-600 hover:text-yellow-900">编辑</a>
                                            <button onclick="alert('删除: 每日市值因子选股')" class="text-red-600 hover:text-red-900">删除</button>
                                        </td>
                                    </tr>
                                    <!-- Example Row 2: Weekly -->
                                    <tr>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">每周动量反转</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">每周一 09:00</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">已禁用</span></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">-</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">2024-07-22 09:10</td>
                                         <td class="px-6 py-4 whitespace-nowrap text-sm text-red-500">失败 (配置错误)</td>
                                         <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2">
                                            <a href="#" class="text-indigo-600 hover:text-indigo-900">详情</a>
                                            <button onclick="alert('手动执行: 每周动量反转')" class="text-blue-600 hover:text-blue-900">手动执行</button>
                                            <a href="#" class="text-yellow-600 hover:text-yellow-900">编辑</a>
                                            <button onclick="alert('删除: 每周动量反转')" class="text-red-600 hover:text-red-900">删除</button>
                                        </td>
                                    </tr>
                                     <!-- Example Row 3: Manual -->
                                    <tr>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">手动价值选股</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">手动</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">就绪</span></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">-</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">2024-07-25 14:30</td>
                                         <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">成功 (选出 25 支)</td>
                                         <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2">
                                            <a href="#" class="text-indigo-600 hover:text-indigo-900">详情</a>
                                            <button onclick="alert('手动执行: 手动价值选股')" class="text-blue-600 hover:text-blue-900">手动执行</button>
                                            <a href="#" class="text-yellow-600 hover:text-yellow-900">编辑</a>
                                            <button onclick="alert('删除: 手动价值选股')" class="text-red-600 hover:text-red-900">删除</button>
                                        </td>
                                    </tr>
                                    <!-- Add more rows as needed -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Any existing scripts -->
    <script>
        // ... existing page script if any ...
    </script>

    <!-- Load Sidebar Script -->
    <script src="../js/load_sidebar.js"></script>

</body>
</html>
